<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#fff8f0;font-family:Arial,Helvetica,sans-serif;color:#222}
body{display:flex;flex-direction:column}
.wrap{flex:1;overflow:auto}
table{border-collapse:collapse;width:100%;height:100%;min-width:760px;table-layout:fixed}
th,td{border:1px solid #b89a96;text-align:center;padding:4px 3px}
.logo{background:#fff;text-align:left;width:200px;padding:1px 8px;vertical-align:middle;border-bottom:3px solid #d4141c}
.logo div{display:flex;align-items:center;gap:8px}
.logo img{height:26px;width:auto;display:block}
.logo small{display:block;font-weight:bold;font-size:9px;line-height:1.15;color:#d4141c}
.dh{background:#d4141c;color:#fff;border-color:#9e0b12;border-top:3px solid #fff;padding:1px 3px}
.dh.today{border-top-color:#f39200;background:#a30c13}
.dh b{display:block;font-size:11px;line-height:1.2}.dh span{display:block;font-size:10px;font-weight:bold;line-height:1.2}
.idc{background:#d4141c;color:#fff;font-weight:bold;width:62px;font-size:11px;padding:1px 3px}
.who{width:200px;background:#fbd9d6;border-right:5px solid #d4141c}
.who b{display:block;font-size:13px}.who .t{display:block;color:#b50d14;font-weight:bold;font-size:12px}.who .ph{display:block;color:#5b4a48;font-size:11px;font-weight:bold}
td.c{font-size:13px;font-weight:bold;background:#fff1e0;height:90px}
td.c small{display:block;color:#6d5b57;font-size:12px;font-weight:normal;margin:3px 0}
td.c em{font-style:normal;font-weight:bold}
td.TRI em{color:#1f7a22}td.REH em{color:#d4141c}
td.TRI{background:#dff1da}
td.REH{background:#ffc7c3}
td.O{background:repeating-linear-gradient(135deg,#444 0 2px,#bdbdbd 2px 5px);color:#111}
td.O span{background:#c9c9c9;padding:0 6px}
td.now{outline:3px solid #f39200;outline-offset:-3px}
tr.foot td{background:#d4141c;color:#fff;font-weight:bold;font-size:12px;height:56px;border-color:#9e0b12}
tr.foot td.hc{font-size:15px}
.dev{background:#fbd9d6;font-size:13px;padding:6px 8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dev input,.dev select{font:inherit;padding:4px 6px;border:1px solid #b89a96;border-radius:6px;background:#fff}
.dev input{min-width:170px;flex:1;max-width:260px}
.dev span{margin-left:auto;color:#6d5b57}
td.dim{opacity:.15}
table tr:first-child th{height:1px}

.dl{font:inherit;padding:4px 10px;border:1px solid #9e0b12;border-radius:6px;background:#d4141c;color:#fff;text-decoration:none;font-weight:bold;white-space:nowrap}
.note{background:#fff3cd;color:#664d03;font-size:13px;padding:6px 10px}
</style>

  if(!s)return undefined;
  if(/^off$/i.test(s))return "O";
  var p=s.split(/\r?\n/).map(function(x){return x.trim()});
  if(p.length<3)return undefined;
  var m=p[0].match(/(\d+)\s*([AP]M)\s*-\s*(\d+)\s*([AP]M)/i);
  if(!m)return undefined;
  var t=p[2].match(/\((\w+)\)/);
  return [m[1]+" "+m[2].toUpperCase()+" - "+m[3]+" "+m[4].toUpperCase(),p[1],t?t[1].toUpperCase():""];
}
function parseWB(wb,X){
  var sheets=[];
  wb.SheetNames.forEach(function(name){
    var ws=wb.Sheets[name];
    function g(r,c){var x=ws[X.utils.encode_cell({r:r-1,c:c-1})];return x&&x.v!=null?x.v:null}
    var ds={},first=null;
    for(var c=3;c<=10;c++){var d=pdate(g(3,c));if(d){ds[c]=d;if(!first||d<first)first=d}}
    if(!first)return;
    var rows=[];
    for(var r=5;;r++){
      var b=g(r,2);
      if(b==null||String(b).indexOf("\n")<0)break;
      var parts=String(b).replace(/\u00a0/g," ").split(/\r?\n/).map(function(x){return x.trim()});
      var idv=g(r,1),id=(idv!=null&&/^\d+$/.test(String(idv).trim()))?String(idv).trim():"";
      var cells={};
      for(var c2=3;c2<=10;c2++){var v=pcell(g(r,c2));if(v!==undefined&&ds[c2])cells[ds[c2]]=v}
      rows.push({n:parts[0],t:parts[1]||"",ph:parts[2]||"",id:id,c:cells});
    }
    sheets.push({first:first,ds:ds,rows:rows});
  });
  sheets.sort(function(a,b){return a.first<b.first?-1:1});   // newer sheet overrides older
  var map={},order=[],dates={};
  sheets.forEach(function(sh){
    Object.keys(sh.ds).forEach(function(k){dates[sh.ds[k]]=1});
    sh.rows.forEach(function(rw){
      var s=map[rw.n];
      if(!s){s=map[rw.n]={n:rw.n,t:rw.t,ph:rw.ph,id:rw.id,c:{}};order.push(s)}
      s.t=rw.t;s.ph=rw.ph;if(rw.id)s.id=rw.id;
      Object.keys(rw.c).forEach(function(d){s.c[d]=rw.c[d]});
    });
  });
  order.forEach(function(s){s.hidden=(s.id==="10349"||/moamen/i.test(s.n))});
  return {dates:Object.keys(dates).sort(),staff:order};
}
function loadExcel(){
  if(!window.XLSX||!window.fetch)return;
  fetch("CS_Schedule.xlsx?v="+Date.now()).then(function(r){if(!r.ok)throw 0;return r.arrayBuffer()}).then(function(buf){
    var d=parseWB(XLSX.read(buf,{type:"array"}),XLSX);
    if(!d.dates.length||!d.staff.length)throw 0;
    DATA=d;fillSim();render();
  }).catch(function(){});
}
function render(){
  var q=document.getElementById("q").value.trim().toLowerCase(),mode=document.getElementById("mode").value;
  var t=sim||iso(new Date()),D=DATA.dates,idx=-1,note="";
  for(var i=0;i<D.length;i++) if(D[i]>=t){idx=i;break}
  if(idx<0){idx=D.length-1;note="This schedule has ended. Please update it for the new week."}
  else if(D[idx]!==t) note=idx===0?"Today is before this schedule starts, showing from the first day.":"No schedule for today, showing the next available day.";
  var V=D.slice(idx,idx+8),isToday=!note;
  document.getElementById("note").innerHTML=note?'<div class="note">'+note+'</div>':"";
  var h='<tr><th class="logo"><div><img alt="Géant" src="'+LOGO+'"><small>Customer Service Department Schedule</small></div></th><th class="idc" style="background:#d4141c;border-top:3px solid #fff">ID</th>';
  V.forEach(function(d,k){h+='<th class="dh'+(k===0&&isToday?" today":"")+'"><b>'+DN[pd(d).getDay()]+"</b><span>"+fmt(d)+"</span></th>"});
  h+="</tr>";
  DATA.staff.forEach(function(s){
    if(s.hidden&&!unlocked)return;
    if(q&&s.n.toLowerCase().indexOf(q)<0)return;
    var hasOff=false,hasWork=false;
    V.forEach(function(d){var c=s.c[d];if(c==="O")hasOff=true;else if(c)hasWork=true});
    if((mode==="off"&&!hasOff)||(mode==="work"&&!hasWork))return;
    h+='<tr><td class="who"><b>'+s.n+'</b><span class="t">'+s.t+'</span><span class="ph">'+s.ph+'</span></td><td class="idc">'+s.id+"</td>";
    V.forEach(function(d,k){
      var c=s.c[d],dim=((mode==="off"&&c!=="O")||(mode==="work"&&(c==="O"||!c)))?" dim":"",now=((k===0&&isToday)?" now":"")+dim;
      if(!c) h+='<td class="c'+now+'"></td>';
      else if(c==="O") h+='<td class="c O'+now+'"><span>OFF</span></td>';
      else h+='<td class="c '+c[2]+now+'">'+c[0]+"<small>"+c[1]+"</small><em>( "+c[2]+" )</em></td>";
    });
    h+="</tr>";
  });
  h+='<tr class="foot"><td colspan="2" class="hc">H.C: &nbsp; &nbsp;</td>';
  V.forEach(function(d){
    var k={TRI:{},REH:{}},hc=0,labs={};
    DATA.staff.forEach(function(s){var c=s.c[d];if(c&&c!=="O"){var L=c[1].charAt(0).toUpperCase();k[c[2]]=k[c[2]]||{};k[c[2]][L]=(k[c[2]][L]||0)+1;labs[L]=1;hc++}});
    function line(n){var o=k[n]||{},L=["M","N"];Object.keys(labs).forEach(function(x){if(L.indexOf(x)<0)L.push(x)});return n+" : "+L.map(function(x){return (o[x]||0)+" "+x}).join(" - ")}
    h+="<td>"+hc+"<br>"+line("TRI")+"<br>"+line("REH")+"</td>";
  });
  document.getElementById("tb").innerHTML=h+"</tr>";
}
document.getElementById("mode").onchange=render;
document.getElementById("q").oninput=function(){
  var el=this,v=el.value;
  if(window.crypto&&crypto.subtle&&v.length>=10){
    crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)).then(function(b){
      var hex=Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,"0")}).join("");
      if(hex===H){unlocked=!unlocked;el.value="";}
      render();
    });
  }
  render();
};
if(location.search.indexOf("test")>=0)document.body.classList.add("test");
render();
loadExcel();

</script>
